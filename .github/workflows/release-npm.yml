name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to authorize the release job
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    environment: npm-production
    defaults:
      run:
        working-directory: devbrain-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: devbrain-mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
